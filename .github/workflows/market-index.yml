name: Publish market index

on:
  push:
    branches: [main]
    paths:
      - 'market/**'
      - 'assets/icon.svg'
      - 'package.json'
      - 'scripts/build-market-index.mjs'
      - '.github/workflows/market-index.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build index from published versions
        run: node scripts/build-market-index.mjs
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp market/index.json _site/index.json
          cp assets/icon.svg _site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
