name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tooling
        run: npm install --no-save --ignore-scripts esbuild@^0.25.0
      - name: Build client bundle
        run: npm run build
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Build market index
        run: node scripts/build-market-index.mjs --check
